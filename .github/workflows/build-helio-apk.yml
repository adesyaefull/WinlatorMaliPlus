name: Build Winlator Mali Helio Ludashi APK

on:
  push:
    branches:
      - mod/helio-g99-g100-native-port
    paths:
      - "app/**"
      - "input_controls/**"
      - "audio_plugin/**"
      - ".github/workflows/build-helio-apk.yml"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".gitmodules"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helio-ludashi-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ludashi-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK, and CMake
        run: |
          sdkmanager \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Verify submodules and required source
        run: |
          git submodule status --recursive
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f gradlew
          chmod +x ./gradlew

      - name: Build Ludashi debug APK
        run: |
          ./gradlew :app:assembleLudashiDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK output
        run: |
          APK="app/build/outputs/apk/ludashi/debug/app-ludashi-debug.apk"
          test -s "$APK" || {
            echo "::error::Expected Ludashi APK was not produced.";
            find app/build/outputs/apk -maxdepth 5 -type f -name "*.apk" -print || true
            exit 1
          }
          ls -lh "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/ludashi/debug/SHA256SUMS.txt

      - name: Upload Ludashi APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Mali-Helio-Ludashi-1.3.0
          path: |
            app/build/outputs/apk/ludashi/debug/app-ludashi-debug.apk
            app/build/outputs/apk/ludashi/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
