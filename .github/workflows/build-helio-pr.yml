name: Validate Helio Ludashi APK

on:
  pull_request:
    branches:
      - bionic-mali-1.2
    paths:
      - "app/**"
      - "input_controls/**"
      - "audio_plugin/**"
      - ".github/workflows/build-helio-pr.yml"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".gitmodules"

permissions:
  contents: read

concurrency:
  group: helio-pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-ludashi-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout pull request source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK, and CMake
        run: |
          sdkmanager \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Verify source checkout
        run: |
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f gradlew
          chmod +x ./gradlew
          git submodule status --recursive

      - name: Compile Ludashi debug APK
        run: |
          ./gradlew :app:assembleLudashiDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK and calculate checksum
        run: |
          APK="app/build/outputs/apk/ludashi/debug/app-ludashi-debug.apk"
          test -s "$APK" || {
            echo "::error::Ludashi debug APK was not produced.";
            find app/build/outputs/apk -type f -name "*.apk" -print || true
            exit 1
          }
          ls -lh "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/ludashi/debug/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Mali-Helio-Ludashi-1.3.0
          path: |
            app/build/outputs/apk/ludashi/debug/app-ludashi-debug.apk
            app/build/outputs/apk/ludashi/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
